<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">What every request is made of, and when each piece can change</title>
  <desc id="desc">A request is the tool list, the instructions, and the current episode. The tool list is built once at launch. The instructions are read at each message, and the memory block at their end is taken once per episode. The episode only grows at its end.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .run { fill: #dafbe1; stroke: #4ac26b; }
      .msg { fill: #ddf4ff; stroke: #54aeff; }
      .ep { fill: #fbefff; stroke: #c297ff; }
      .grow { fill: #fff8c5; stroke: #d4a72c; }
      .ghost { fill: #ffffff; stroke: #d4a72c; stroke-dasharray: 4 3; }
      .box { stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #1f2328; }
      .c { font-size: 11.5px; fill: #1f2328; text-anchor: middle; }
      .n { font-size: 12px; fill: #424a53; }
      .brace { stroke: #57606a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="330" rx="12"/>

  <!-- group titles -->
  <text class="t" x="40" y="42">Tool list</text>
  <text class="t" x="430" y="42">Instructions</text>
  <text class="t" x="800" y="42">Current episode</text>

  <!-- tool list segments -->
  <rect class="run box" x="40" y="56" width="130" height="64" rx="6"/>
  <text class="c" x="105" y="84">Built-in tools,</text>
  <text class="c" x="105" y="100">in a fixed order</text>
  <rect class="run box" x="174" y="56" width="92" height="64" rx="6"/>
  <text class="c" x="220" y="84">Tools a switch</text>
  <text class="c" x="220" y="100">adds, at the end</text>
  <rect class="run box" x="270" y="56" width="74" height="64" rx="6"/>
  <text class="c" x="307" y="84">MCP tools,</text>
  <text class="c" x="307" y="100">by name</text>
  <rect class="run box" x="348" y="56" width="62" height="64" rx="6"/>
  <text class="c" x="379" y="92">run_script</text>

  <!-- instructions segments -->
  <rect class="msg box" x="430" y="56" width="100" height="64" rx="6"/>
  <text class="c" x="480" y="84">The owner's</text>
  <text class="c" x="480" y="100">editable part</text>
  <rect class="msg box" x="534" y="56" width="134" height="64" rx="6"/>
  <text class="c" x="601" y="84">The fixed part, with</text>
  <text class="c" x="601" y="100">the list of skills</text>
  <rect class="ep box" x="672" y="56" width="108" height="64" rx="6"/>
  <text class="c" x="726" y="84">The memory</text>
  <text class="c" x="726" y="100">block</text>

  <!-- episode segments -->
  <rect class="grow box" x="800" y="56" width="62" height="64" rx="6"/>
  <text class="c" x="831" y="92">message</text>
  <rect class="grow box" x="866" y="56" width="50" height="64" rx="6"/>
  <text class="c" x="891" y="92">call</text>
  <rect class="grow box" x="920" y="56" width="50" height="64" rx="6"/>
  <text class="c" x="945" y="92">result</text>
  <rect class="grow box" x="974" y="56" width="50" height="64" rx="6"/>
  <text class="c" x="999" y="92">reply</text>
  <rect class="ghost box" x="1028" y="56" width="52" height="64" rx="6"/>
  <text class="c" x="1054" y="92">next</text>

  <!-- braces -->
  <path class="brace" d="M40 134 V142 H410 V134"/>
  <path class="brace" d="M430 134 V142 H668 V134"/>
  <path class="brace" d="M672 134 V142 H780 V134"/>
  <path class="brace" d="M800 134 V142 H1080 V134"/>

  <!-- when each can change -->
  <text class="s" x="40" y="166" font-weight="600">Built once, at launch.</text>
  <text class="n" x="40" y="186">A new tool, a new MCP server, or a</text>
  <text class="n" x="40" y="203">switch that adds a tool takes effect</text>
  <text class="n" x="40" y="220">at the next launch.</text>

  <text class="s" x="430" y="166" font-weight="600">Read at each message.</text>
  <text class="n" x="430" y="186">An edit in Settings or a new skill</text>
  <text class="n" x="430" y="203">applies from the owner's next</text>
  <text class="n" x="430" y="220">message, not in the middle of one.</text>

  <text class="s" x="672" y="166" font-weight="600">Taken once</text>
  <text class="s" x="672" y="183" font-weight="600">per episode.</text>
  <text class="n" x="672" y="203">A memory change</text>
  <text class="n" x="672" y="220">shows next episode.</text>

  <text class="s" x="800" y="166" font-weight="600">Only grows at the end.</text>
  <text class="n" x="800" y="186">Nothing earlier is edited or removed.</text>
  <text class="n" x="800" y="203">/new or the idle timeout starts a new</text>
  <text class="n" x="800" y="220">episode with an empty one.</text>

  <!-- why -->
  <rect x="40" y="250" width="1040" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="s" x="56" y="274" font-weight="600">Why it is built this way</text>
  <text class="n" x="56" y="293">The provider caches a request by its starting bytes. When each request starts with the one before it, a reply is fast and cheap. One changed byte early on starts the cache over.</text>
</svg>
